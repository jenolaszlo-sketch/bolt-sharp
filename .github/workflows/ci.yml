# Standard build and test validation.
#
# Deliberately narrow: builds and tests the repository and runs the private-key
# scanner. It cannot publish NuGet packages, create releases, or execute the
# Q-B5B-09 native-Linux qualification campaign (that campaign remains a separate,
# manually dispatched, bounded workflow).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and secret scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check Python availability
        run: |
          python --version
          where python
          echo "=== Checking script ==="
          if (Test-Path "docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/scan_for_private_keys.py") {
              echo "Script found"
          } else {
              echo "Script NOT found"
              dir docs/reviews/
              dir docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/
              dir docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/
          }

      - name: Reject private key material
        run: python docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/scan_for_private_keys.py

      - name: Secret scanner controls
        run: python docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/scan_for_private_keys.py --selftest

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (Release)
        run: dotnet build BoltSharp.slnx -c Release --nologo

      - name: Test (Release)
        run: dotnet test BoltSharp.slnx -c Release --no-build --nologo

      - name: Validate artifact security (scan for private keys in evidence directories)
        if: always()
        run: |
          python docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/sanitize_artifacts.py docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01/results --scan-only
          python docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/sanitize_artifacts.py docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/results --scan-only
          echo "evidence security scan exit: $?"

  aot-verification:
    name: Native AOT verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            dotnet-version: "8.0.x"
            rid: win-x64
            tfm: net8.0
          - os: windows-latest
            dotnet-version: "10.0.x"
            rid: win-x64
            tfm: net8.0
          - os: ubuntu-latest
            dotnet-version: "8.0.x"
            rid: linux-x64
            tfm: net8.0
          - os: ubuntu-latest
            dotnet-version: "10.0.x"
            rid: linux-x64
            tfm: net8.0
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up .NET (${{ matrix.dotnet-version }})
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore AOT harness
        run: dotnet restore tests/BoltSharp.AotHarness/BoltSharp.AotHarness.csproj

      - name: AOT analyzer (PublishAot + PublishTrimmed)
        run: dotnet build tests/BoltSharp.AotHarness/BoltSharp.AotHarness.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:PublishTrimmed=true --no-restore

      - name: Publish Native AOT harness
        run: dotnet publish tests/BoltSharp.AotHarness/BoltSharp.AotHarness.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o ./artifacts/aot-harness-${{ matrix.rid }}

      - name: Execute Native AOT harness
        run: ./artifacts/aot-harness-${{ matrix.rid }}/BoltSharp.AotHarness${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - name: Build library package
        run: |
          dotnet pack src/BoltSharp/BoltSharp.csproj -c Release --output ./artifacts/packages --no-build
          PKG_PATH=$(ls ./artifacts/packages/BoltSharp.*.nupkg | head -1)
          echo "PACKAGE_PATH=$PKG_PATH" >> $GITHUB_ENV
          echo "Built package: $PKG_PATH"

      - name: Publish Native AOT consumer (package-based)
        run: |
          PACKAGE_DIR="${{ github.workspace }}/artifacts/packages"
          dotnet new nugetconfig -o ./artifacts/consumer-test
          dotnet nuget add source "$PACKAGE_DIR" --name local-packages --configfile ./artifacts/consumer-test/NuGet.Config
          cd tests/BoltSharp.AotConsumerPackage
          dotnet restore --configfile ../../artifacts/consumer-test/NuGet.Config --packages ../../artifacts/consumer-test/packages
          dotnet publish -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o ../../artifacts/aot-consumer-${{ matrix.rid }} --no-restore

      - name: Execute Native AOT consumer (package-based)
        run: ./artifacts/aot-consumer-${{ matrix.rid }}/BoltSharp.AotConsumerPackage${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - name: Validate artifact security
        if: always()
        run: |
          python docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/sanitize_artifacts.py docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01/results --scan-only
          python docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/sanitize_artifacts.py docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/results --scan-only
          echo "evidence security scan exit: $?"

  managed-linux-regression:
    name: Managed Linux regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (Release)
        run: dotnet build BoltSharp.slnx -c Release --nologo

      - name: Test (Release)
        run: dotnet test BoltSharp.slnx -c Release --no-build --nologo