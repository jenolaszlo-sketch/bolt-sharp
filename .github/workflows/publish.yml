name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # Packaging must reproduce the tagged release, never current main. Require a tag ref
      # whose name matches the project version. For manual recovery, dispatch on the tag:
      #   gh workflow run publish.yml --ref v1.0.0-preview.1
      - name: Validate tag matches release version
        shell: pwsh
        run: |
          [xml] $xml = Get-Content -LiteralPath src/BoltSharp/BoltSharp.csproj
          $VERSION = [string] $xml.Project.PropertyGroup.Version
          if (-not $VERSION) {
            Write-Error "Could not read <Version> from src/BoltSharp/BoltSharp.csproj"
            exit 1
          }
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            Write-Error ("Publishing requires a tag ref. Dispatch on the release tag, e.g. " +
              "'gh workflow run publish.yml --ref v$VERSION'. Ref was '$($env:GITHUB_REF_NAME)' ($($env:GITHUB_REF_TYPE)).")
            exit 1
          }
          if ($env:GITHUB_REF_NAME -ne "v$VERSION") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match release version $VERSION"
            exit 1
          }
          Write-Host "Tag $env:GITHUB_REF_NAME matches release version $VERSION at commit $($env:GITHUB_SHA)"

      - name: Build library package (authoritative dotnet pack)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet pack src/BoltSharp/BoltSharp.csproj -c Release -o ./artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify package contents
        shell: pwsh
        run: |
          $nupkg = @(Get-ChildItem ./artifacts/BoltSharp.*.nupkg)
          if ($nupkg.Count -ne 1) {
            throw "Expected exactly 1 NuGet package; found $($nupkg.Count)."
          }
          $package = $nupkg[0]
          Write-Host "Package: $($package.Name)"
          Write-Host "Size: $($package.Length) bytes"
          Write-Host "SHA256: $((Get-FileHash $package.FullName -Algorithm SHA256).Hash)"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName }
            $required = @('lib/net8.0/BoltSharp.dll', 'README.md', 'LICENSE')
            foreach ($r in $required) {
              if (-not ($entries -contains $r)) { throw "Package is missing required entry '$r'." }
            }
            Write-Host "Entries: $($entries -join ', ')"
          } finally {
            $zip.Dispose()
          }

      - name: Artifact and secret security checks
        shell: pwsh
        run: |
          python docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/scan_for_private_keys.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/sanitize_artifacts.py docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01/results --scan-only
          python docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/tools/sanitize_artifacts.py docs/reviews/Q-B5B-09-TLS-LINUX-QUAL-01-R1/results --scan-only

      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet trusted publishing did not return a temporary API key.'
          }
          $package = Get-ChildItem ./artifacts/BoltSharp.*.nupkg
          dotnet nuget push $package.FullName `
            --source https://api.nuget.org/v3/index.json `
            --api-key $env:NUGET_API_KEY `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }